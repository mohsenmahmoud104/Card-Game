<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
  :root{--navy:#1B365D;--navy-d:#10233F;--gold:#C8A75B;--gold-l:#E9D6AA;--bg:#F6F4EE;--card:#fff;--text:#1d2433;--muted:#6b7280;--line:#e6e2d8;--up:#1c7c4a;--down:#A6402D}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1626;--card:#16233a;--text:#e8ecf4;--muted:#9aa6bb;--line:#26354f;--navy:#C8A75B;--navy-d:#E9D6AA}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.6}
  .wrap{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{margin:0;font-size:24px;color:var(--navy-d);font-weight:800}
  .sub{margin:2px 0 0;color:var(--muted);font-size:13px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
  .pill{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 16px;border-radius:999px;cursor:pointer;font:600 13px Cairo,Tahoma,sans-serif}
  .pill.active{background:var(--navy-d);color:#fff;border-color:var(--navy-d)}
  @media (prefers-color-scheme:dark){.pill.active{color:#10233F}}
  .refresh{margin-inline-start:auto;color:var(--muted);background:none;border:0;cursor:pointer;font:600 13px Cairo,sans-serif}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .tile .k{color:var(--muted);font-size:12.5px}
  .tile .n{font-size:30px;font-weight:800;color:var(--navy-d);line-height:1.25}
  .tile .d{font-size:12px;color:var(--muted)}
  .d.up{color:var(--up)}.d.down{color:var(--down)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .panel h3{margin:0 0 12px;font-size:15px;color:var(--navy-d);font-weight:800}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .row{margin-bottom:10px}
  .row .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
  .row .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .top b{color:var(--navy-d);font-variant-numeric:tabular-nums}
  .track{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:3px}
  .fill{height:100%;background:var(--navy-d);border-radius:6px}
  .chart{display:flex;align-items:flex-end;gap:3px;height:180px;padding-top:8px;border-bottom:1px solid var(--line)}
  .col{flex:1;background:var(--navy-d);border-radius:3px 3px 0 0;min-height:2px;position:relative}
  .xlabels{display:flex;gap:3px;margin-top:4px;color:var(--muted);font-size:10.5px}
  .xlabels span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
  .note{color:var(--muted);font-size:12px;margin-top:6px}
  .empty{color:var(--muted);padding:8px 0}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  th{color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.page{max-width:260px;overflow:hidden;text-overflow:ellipsis}
  .loading{text-align:center;color:var(--muted);padding:50px 0}
  .err{background:#fbeae6;color:#7a2a1c;border-radius:12px;padding:12px 14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>إحصائيات موقع المدرسة الليبية داماي</h1>
      <p class="sub">زيارات libyandamai.com — بيانات مجهولة الهوية، بلا ملفات تعريف ارتباط وبلا عناوين IP.</p>
    </div>
  </header>
  <div class="toolbar" id="periods">
    <button class="pill" data-p="today">اليوم</button>
    <button class="pill" data-p="7d">آخر 7 أيام</button>
    <button class="pill active" data-p="30d">آخر 30 يومًا</button>
    <button class="pill" data-p="3m">آخر 3 أشهر</button>
    <button class="pill" data-p="1y">آخر سنة</button>
    <button class="pill" data-p="all">كل الفترة</button>
    <button class="refresh" id="refresh">↻ تحديث</button>
  </div>
  <div id="content"><div class="loading">جارٍ التحميل…</div></div>
</div>
<script>
(function(){
  var nf = new Intl.NumberFormat('ar-EG');
  var cur = '30d';
  var EV = {visit:'زيارة', download:'تنزيل', whatsapp_click:'نقر واتساب', form_submit:'إرسال نموذج', quiz_start:'بدء مسابقة', quiz_done:'إنهاء مسابقة'};
  var names; try { names = new Intl.DisplayNames(['ar'], {type:'region'}); } catch(e) {}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function flag(cc){ return /^[A-Z]{2}$/.test(cc)? String.fromCodePoint.apply(null, cc.split('').map(function(c){return 127397+c.charCodeAt(0);})) : '🌐'; }
  function cname(cc){ if(!/^[A-Z]{2}$/.test(cc)) return cc==='XX'?'غير معروف':cc; try{return names.of(cc)||cc;}catch(e){return cc;} }
  function rows(items, fmt){
    if(!items||!items.length) return '<div class="empty">لا توجد بيانات لهذه الفترة بعد.</div>';
    var max = Math.max.apply(null, items.map(function(i){return i.count;}));
    return items.map(function(i){
      var l = fmt? fmt(i.label) : esc(i.label);
      return '<div class="row"><div class="top"><span title="'+esc(i.label)+'">'+l+'</span><b>'+nf.format(i.count)+'</b></div><div class="track"><div class="fill" style="width:'+(max?Math.max(2,Math.round(i.count/max*100)):0)+'%"></div></div></div>';
    }).join('');
  }
  function delta(now, prev){
    if(!prev) return '<div class="d">لا توجد بيانات للفترة السابقة</div>';
    var p = Math.round((now-prev)/prev*100);
    return '<div class="d '+(p>=0?'up':'down')+'">'+(p>=0?'▲ ':'▼ ')+nf.format(Math.abs(p))+'٪ عن الفترة السابقة</div>';
  }
  function tile(k,n,d){ return '<div class="tile"><div class="k">'+k+'</div><div class="n">'+nf.format(n)+'</div>'+(d||'<div class="d">&nbsp;</div>')+'</div>'; }
  function chart(daily){
    if(!daily||!daily.length) return '<div class="empty">لا توجد بيانات كافية.</div>';
    var max = Math.max.apply(null, daily.map(function(x){return x.v;}))||1;
    var every = Math.ceil(daily.length/12);
    return '<div class="chart" role="img" aria-label="الزوار يوميًا">'+daily.map(function(x){
      return '<div class="col" style="height:'+Math.max(1,Math.round(x.v/max*100))+'%" title="'+esc(x.k)+': '+x.v+'"></div>';
    }).join('')+'</div><div class="xlabels">'+daily.map(function(x,i){return '<span>'+(i%every===0?esc(x.k):'')+'</span>';}).join('')+'</div>';
  }
  function render(s){
    var ev = s.events||{};
    var h = '<div class="tiles">'+
      tile('الزوار', s.visitors, delta(s.visitors, s.visitorsPrev))+
      tile('مشاهدات الصفحات', s.pageviews, delta(s.pageviews, s.pageviewsPrev))+
      tile('الآن على الموقع', s.onlineNow, '<div class="d">آخر ٣٠ دقيقة</div>')+
      tile('الدول', s.countriesCount)+
      tile('نقرات واتساب', ev.whatsapp_click||0)+
      tile('تنزيلات', ev.download||0)+
      tile('مسابقات بدأت', ev.quiz_start||0, '<div class="d">أنهى '+nf.format(ev.quiz_done||0)+'</div>')+
      tile('نماذج أُرسلت', ev.form_submit||0)+
    '</div>';
    h += '<div class="panel"><h3>الزوار '+(s.granularity==='month'?'شهريًا':'يوميًا')+'</h3>'+chart(s.daily)+'</div>';
    h += '<div class="grid">'+
      '<div class="panel"><h3>الدول</h3>'+rows(s.countries,function(c){return flag(c)+' '+esc(cname(c));})+'</div>'+
      '<div class="panel"><h3>أكثر الصفحات زيارة</h3>'+rows(s.topPages)+'</div>'+
      '<div class="panel"><h3>مصادر الزيارات</h3>'+rows(s.sources)+'<div class="note">«مباشر» = كتابة الرابط بنفسه أو فتحه من تطبيق لا يرسل المصدر (مثل واتساب أحيانًا).</div></div>'+
      '<div class="panel"><h3>الأجهزة</h3>'+rows(s.devices)+'</div>'+
      '<div class="panel"><h3>المتصفحات</h3>'+rows(s.browsers)+'</div>'+
      '<div class="panel"><h3>أنظمة التشغيل</h3>'+rows(s.os)+'</div>'+
    '</div>';
    h += '<div class="panel"><h3>آخر الزيارات</h3>'+(s.recent&&s.recent.length?'<div class="tablewrap"><table><thead><tr><th>الوقت</th><th>الدولة</th><th>الصفحة</th><th>الحدث</th><th>المصدر</th><th>الجهاز</th></tr></thead><tbody>'+
      s.recent.map(function(r){return '<tr><td>'+esc(r.t)+'</td><td>'+flag(r.country)+' '+esc(cname(r.country))+'</td><td class="page" title="'+esc(r.page)+'">'+esc(r.page)+'</td><td>'+esc(EV[r.event]||r.event)+'</td><td>'+esc(r.source)+'</td><td>'+esc(r.device)+'</td></tr>';}).join('')+
      '</tbody></table></div>':'<div class="empty">لا توجد زيارات في هذه الفترة.</div>')+'</div>';
    h += '<div class="note">الدولة تأتي من رأس Netlify الجغرافي عند توفره، وإلا تُقدَّر من المنطقة الزمنية للمتصفح (تقريبية). الزائر = معرّف عشوائي على الجهاز لا يرتبط باسم ولا ببيانات طالب.</div>';
    document.getElementById('content').innerHTML = h;
  }
  function fail(e){ document.getElementById('content').innerHTML='<div class="err">تعذّر تحميل الإحصائيات: '+esc(e&&e.message?e.message:e)+'</div>'; }
  function load(){
    document.getElementById('content').innerHTML='<div class="loading">جارٍ التحميل…</div>';
    google.script.run.withSuccessHandler(render).withFailureHandler(fail).getAnalyticsStats(cur);
  }
  document.getElementById('periods').addEventListener('click',function(e){
    var b=e.target.closest('.pill'); if(!b) return;
    document.querySelectorAll('.pill').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active'); cur=b.dataset.p; load();
  });
  document.getElementById('refresh').addEventListener('click',load);
  load();
})();
</script>
</body>
</html>
